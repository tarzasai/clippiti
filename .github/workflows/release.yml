name: Build installers

# Everything here runs on GitHub-hosted runners. Nothing is built locally.
# Trigger: pushing a v* tag (same tag that drives publish.yml) or manual dispatch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Pinned native binaries fetched on the runners (not committed, not local).
  FFMPEG_LINUX_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
  FFMPEG_WINDOWS_URL: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
  # libmpv for Windows: shinchiro mpv-dev build, pinned by tag + sha256.
  MPV_WINDOWS_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261003/mpv-dev-x86_64-20261003-git-3186d369f9.7z
  MPV_WINDOWS_SHA256: b8c2d656c1584d5f08196fcee5c2d0783d1f76021897c4e0b3cc30f94c79522e

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build + runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 patchelf desktop-file-utils file
          python -m pip install --upgrade pip pyinstaller
          pip install -e .

      - name: Fetch static ffmpeg
        run: |
          mkdir -p native
          curl -L "${FFMPEG_LINUX_URL}" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg native/ffmpeg
          chmod +x native/ffmpeg
          echo "CLIPPITI_FFMPEG=$PWD/native/ffmpeg" >> "$GITHUB_ENV"

      - name: Locate libmpv
        run: |
          LIBMPV="$(ldconfig -p | awk '/libmpv\.so\.2/{print $NF; exit}')"
          echo "Using libmpv at: $LIBMPV"
          echo "CLIPPITI_LIBMPV=$LIBMPV" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm clippiti.spec

      - name: Bundle libmpv dependencies next to the binary
        run: |
          INTERNAL="dist/clippiti/_internal"
          # ldd prints the full transitive closure; copy it (minus the standard
          # AppImage excludelist) into _internal where PyInstaller's loader looks.
          EXCLUDE='libc\.|libm\.|libdl\.|libpthread\.|librt\.|libresolv\.|libstdc\+\+|libgcc_s|ld-linux|libGL|libEGL|libGLX|libOpenGL|libdrm|libxcb|libX11|libxkbcommon|libwayland'
          for dep in $(ldd "${CLIPPITI_LIBMPV}" | awk '/=>/{print $3}' | grep -vE "$EXCLUDE"); do
            [ -f "$dep" ] && cp -n "$dep" "$INTERNAL/" || true
          done

      - name: Assemble AppDir
        run: |
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r dist/clippiti "$APPDIR/usr/bin/clippiti"
          cp packaging/linux/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/linux/clippiti.desktop "$APPDIR/clippiti.desktop"
          cp src/clippiti/resources/icons/app-icon.png "$APPDIR/clippiti.png"

      - name: Build AppImage
        run: |
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir "Clippiti-${GITHUB_REF_NAME}-x86_64.AppImage"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Clippiti-*-x86_64.AppImage

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -e .

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          curl.exe -L "$env:FFMPEG_WINDOWS_URL" -o ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $ff = Get-ChildItem -Recurse ffmpeg_extract -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force native | Out-Null
          Copy-Item $ff.FullName native\ffmpeg.exe
          echo "CLIPPITI_FFMPEG=$PWD\native\ffmpeg.exe" >> $env:GITHUB_ENV

      - name: Fetch libmpv (mpv-2.dll)
        shell: pwsh
        run: |
          # python-mpv loads mpv-2.dll from the application directory on Windows.
          curl.exe -L "$env:MPV_WINDOWS_URL" -o mpv-dev.7z
          $hash = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_WINDOWS_SHA256) {
            throw "libmpv archive sha256 mismatch: got $hash expected $env:MPV_WINDOWS_SHA256"
          }
          & 7z x mpv-dev.7z -ompv_extract | Out-Null
          $dll = Get-ChildItem -Recurse mpv_extract -Include 'libmpv-2.dll','mpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw "No libmpv-2.dll/mpv-2.dll found in archive." }
          New-Item -ItemType Directory -Force native | Out-Null
          Copy-Item $dll.FullName native\mpv-2.dll
          echo "CLIPPITI_LIBMPV=$PWD\native\mpv-2.dll" >> $env:GITHUB_ENV

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm clippiti.spec

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows\clippiti.iss"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/installer/*.exe
