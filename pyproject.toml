[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clippiti-player"
dynamic = ["version"]
description = "Single-stream live player with rolling buffer, clipping, and recording"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tarzasai" },
]
keywords = [
  "pyqt6",
  "streamlink",
  "mpv",
  "ffmpeg",
  "hls",
  "livestream",
  "video-player",
  "desktop-app",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: End Users/Desktop",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "python-mpv>=1.0.7",
    "PyQt6>=6.10.0",
    "PyYAML>=6.0",
    "streamlink>=8.0.0",
    "wakepy>=1.0.0",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "Pillow>=12.0.0",
]

[project.scripts]
clippiti = "clippiti.__main__:main"

[project.urls]
Repository = "https://github.com/tarzasai/Clippiti"
Issues = "https://github.com/tarzasai/Clippiti/issues"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
write_to = "src/clippiti/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clippiti.services --cov=clippiti.model.config --cov-report=term-missing --cov-fail-under=80"
